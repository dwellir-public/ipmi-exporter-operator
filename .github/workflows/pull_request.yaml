name: Lint

on: pull_request

jobs:
    lint-charm:
        name: "Run linter"
        runs-on: "ubuntu-latest"
        steps:
            - uses: actions/checkout@v2
            - uses: actions/setup-python@v2
              with:
                  python-version: '3.x'
                  architecture: 'x64'
            - name: "Install tox"
              run: |
                  pip install tox

            - name: "lint the charms"
              run: |
                  make lint

    unit:
        name: "Unit tests (Python ${{ matrix.python }})"
        runs-on: "ubuntu-latest"
        strategy:
            matrix:
                python: ['3.10', '3.12', '3.14']
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python }}
            - uses: astral-sh/setup-uv@v6
            - name: "Run unit tests"
              env:
                  PYTHONPATH: lib:src
              run: uv run --python "${{ matrix.python }}" --frozen --group unit pytest tests/unit
